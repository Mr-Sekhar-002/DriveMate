name: drivemate_flutter
description: "DriveMate - Car rental and on-demand professional driver hiring platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.3
  url_launcher: ^6.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: 11.1.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  crypto: ^3.0.3
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1C38"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
